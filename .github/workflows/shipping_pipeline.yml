name: Shipping Pipeline


# ============================================================
# TRIGGERS
# ============================================================

on:

  # تشغيل يدوي من GitHub
  workflow_dispatch:

  # تشغيل تلقائي يومياً
  schedule:

    # 06:00 UTC
    # = 09:00 Cairo عندما يكون UTC+3
    - cron: "0 6 * * *"


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:

  group: shipping-pipeline

  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  shipping-pipeline:

    name: Run Shipping Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 60


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: pip


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # CREATE DIRECTORIES
      # ======================================================

      - name: Create pipeline directories

        run: |

          mkdir -p files

          mkdir -p cleaned_files


      # ======================================================
      # RUN PIPELINE
      # ======================================================

      - name: Run Shipping Pipeline

        env:

          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

          DB_URL_Shipping: ${{ secrets.DB_URL_Shipping }}

          DB_URL_Orders: ${{ secrets.DB_URL_Orders }}

        run: |

          python main.py


      # ======================================================
      # UPLOAD FILES FOR DEBUGGING
      # ======================================================

      - name: Upload pipeline files

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: shipping-pipeline-files

          path: |

            files/

            cleaned_files/

          retention-days: 7

          if-no-files-found: ignore
