name: Shipping Pipeline

# ============================================================
# TRIGGERS
# ============================================================

on:
  # تشغيل يدوي من GitHub
  workflow_dispatch:

  # تشغيل تلقائي يومياً
  schedule:
    # 06:00 UTC
    # = 09:00 Cairo عندما يكون UTC+3
    - cron: "0 6 * * *"

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: shipping-pipeline
  cancel-in-progress: false

# ============================================================
# JOB
# ============================================================

jobs:
  shipping-pipeline:
    name: Run Shipping Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ======================================================
      # CHECK PYTHON
      # ======================================================

      - name: Check Python
        run: |
          which python
          python --version
          python -m pip --version

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt

      # ======================================================
      # FORCE INSTALL PSYCOPG2
      # ======================================================

      - name: Install psycopg2-binary
        run: |
          python -m pip install --no-cache-dir --force-reinstall psycopg2-binary

      # ======================================================
      # VERIFY PYTHON DEPENDENCIES
      # ======================================================

      - name: Verify Python dependencies
        run: |
          python - <<'PY'
          import pandas
          import dotenv
          import google.auth
          import googleapiclient
          import gspread
          import openpyxl
          import xlrd
          import supabase
          import psycopg2
          import rapidfuzz

          from psycopg2.extras import execute_values

          print("========================================")
          print("All required dependencies are installed")
          print("========================================")
          print("pandas:", pandas.__version__)
          print("psycopg2:", psycopg2.__version__)
          print("rapidfuzz:", rapidfuzz.__version__)
          print("execute_values: OK")
          PY

      # ======================================================
      # CREATE DIRECTORIES
      # ======================================================

      - name: Create pipeline directories
        run: |
          mkdir -p files
          mkdir -p cleaned_files

      # ======================================================
      # CREATE GOOGLE CREDENTIALS
      # ======================================================

      - name: Create Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "ERROR: GOOGLE_CREDENTIALS_JSON secret is empty or not configured."
            exit 1
          fi

          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json

          if [ ! -s credentials.json ]; then
            echo "ERROR: credentials.json was not created."
            exit 1
          fi

          echo "credentials.json created successfully."

      # ======================================================
      # VERIFY GOOGLE CREDENTIALS
      # ======================================================

      - name: Verify Google credentials
        run: |
          python - <<'PY'
          import json

          with open("credentials.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "type",
              "project_id",
              "private_key",
              "client_email"
          ]

          missing = [
              key for key in required
              if not data.get(key)
          ]

          if missing:
              raise ValueError(
                  f"credentials.json is missing required fields: {missing}"
              )

          print("========================================")
          print("Google credentials JSON is valid")
          print("========================================")
          print("Credential type:", data.get("type"))
          print("Project ID:", data.get("project_id"))
          print("Client email:", data.get("client_email"))
          PY

      # ======================================================
      # VERIFY DATABASE CONFIGURATION
      # ======================================================

      - name: Verify database configuration
        env:
          DB_URL_Shipping: ${{ secrets.DB_URL_Shipping }}
          DB_URL_Orders: ${{ secrets.DB_URL_Orders }}
        run: |
          python - <<'PY'
          import os

          print("========================================")
          print("DATABASE CONFIGURATION CHECK")
          print("========================================")

          for name in ["DB_URL_Shipping", "DB_URL_Orders"]:
              value = os.getenv(name)

              if not value:
                  print(f"{name}: NOT SET")
                  raise SystemExit(
                      f"ERROR: GitHub Secret {name} is missing."
                  )

              value = value.strip()

              print(f"{name}: SET")
              print(f"{name} length: {len(value)}")

              if value.startswith(("postgresql://", "postgres://")):
                  print(f"{name}: PostgreSQL URL format detected")

              elif "=" in value:
                  print(f"{name}: PostgreSQL keyword/value format detected")

              else:
                  print(
                      f"ERROR: {name} does not look like a valid "
                      "PostgreSQL connection string."
                  )

                  raise SystemExit(1)

          print("========================================")
          print("Database configuration check passed")
          print("========================================")
          PY

      # ======================================================
      # TEST DATABASE CONNECTION
      # ======================================================

      - name: Test Shipping database connection
        env:
          DB_URL_Shipping: ${{ secrets.DB_URL_Shipping }}
        run: |
          python - <<'PY'
          import os
          import psycopg2

          db_url = os.getenv("DB_URL_Shipping", "").strip()

          if not db_url:
              raise RuntimeError("DB_URL_Shipping is empty.")

          print("Testing Shipping PostgreSQL connection...")

          try:
              with psycopg2.connect(
                  db_url,
                  connect_timeout=15
              ) as conn:
                  with conn.cursor() as cursor:
                      cursor.execute("SELECT 1")
                      result = cursor.fetchone()

                  print("Shipping database connection: OK")
                  print("Test query result:", result)

          except Exception as e:
              print("ERROR: Shipping database connection failed.")
              print("Error type:", type(e).__name__)
              print("Error:", str(e))
              raise
          PY

      # ======================================================
      # VERIFY SHIPPING PROJECT IMPORTS
      # ======================================================

      - name: Verify Shipping imports
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DB_URL_Shipping: ${{ secrets.DB_URL_Shipping }}
          DB_URL_Orders: ${{ secrets.DB_URL_Orders }}
        run: |
          python - <<'PY'
          from pipeline.Shipping.DBManage import execute_values
          from pipeline.Shipping.CLShipping import *

          print("========================================")
          print("Shipping project imports: OK")
          print("========================================")
          PY

      # ======================================================
      # RUN SHIPPING PIPELINE
      # ======================================================

      - name: Run Shipping Pipeline
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DB_URL_Shipping: ${{ secrets.DB_URL_Shipping }}
          DB_URL_Orders: ${{ secrets.DB_URL_Orders }}
        run: |
          python ShippingPipeline.py

      # ======================================================
      # UPLOAD PIPELINE FILES
      # ======================================================

      - name: Upload pipeline files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-pipeline-files
          path: |
            files/
            cleaned_files/
          retention-days: 7
          if-no-files-found: ignore

      # ======================================================
      # CLEANUP CREDENTIALS
      # ======================================================

      - name: Remove credentials
        if: always()
        run: |
          rm -f credentials.json
          echo "credentials.json removed."
