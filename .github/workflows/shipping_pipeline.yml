name: Shipping Pipeline

# ============================================================
# TRIGGERS
# ============================================================

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: shipping-pipeline
  cancel-in-progress: false

# ============================================================
# JOB
# ============================================================

jobs:
  shipping-pipeline:
    name: Run Shipping Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # تثبيت سريع جداً باستخدام uv
      - name: Install dependencies with uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          uv pip install --system -r requirements.txt

      - name: Create pipeline directories
        run: |
          mkdir -p files
          mkdir -p cleaned_files

      - name: Run Shipping Pipeline
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DB_URL_Shipping: ${{ secrets.DB_URL_Shipping }}
          DB_URL_Orders: ${{ secrets.DB_URL_Orders }}
        run: |
          python ShippingPipeline.py

      - name: Upload pipeline files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-pipeline-files
          path: |
            files/
            cleaned_files/
          retention-days: 7
          if-no-files-found: ignore